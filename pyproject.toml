[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vtrr-queue"
version = "0.1.0"
description = "Virtual-time round-robin fair queue on Redis"
readme = "README.md"
authors = [{ name = "Nicolas Johnson", email = "nicolas.johnson@c4ads.org" }]
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["redis>=4.5.4", "celery>=5.0", "fakeredis[lua] (>=2.37.0,<3.0.0)", "pytest (>=9.1.1,<10.0.0)"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Framework :: Celery",
    "Topic :: System :: Distributed Computing",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
dev = ["pytest", "fakeredis"]

