[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vtrr-queue"
version = "0.1.0"
description = "Virtual-time round-robin fair queue on Redis"
requires-python = ">=3.10,<=3.11.5"
dependencies = ["redis>=4.5.4", "celery>=5.0"]

[project.optional-dependencies]
dev = ["pytest", "fakeredis"]

